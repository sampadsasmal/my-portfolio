<section id="hero" class="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden">
  <!-- Interactive Particle Canvas -->
  <app-particle-canvas></app-particle-canvas>

  <!-- Animated Background Elements -->
  <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[80%] md:w-[40%] h-[40%] bg-blue-600/10 blur-[80px] md:blur-[120px] rounded-full animate-pulse"></div>
    <div class="absolute bottom-[10%] right-[-5%] w-[70%] md:w-[35%] h-[35%] bg-emerald-500/5 blur-[80px] md:blur-[100px] rounded-full animate-bounce [animation-duration:10s]"></div>
    
    <!-- Grid Pattern Overlay -->
    <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-10 mix-blend-overlay"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-slate-950/30 to-slate-950"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 pointer-events-none">
    <div class="text-center">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 mb-6 pointer-events-auto">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
        </span>
        <span class="text-blue-400 text-[10px] md:text-xs font-bold uppercase tracking-wider">Available for new opportunities</span>
      </div>
      
      <h2 class="text-slate-400 font-medium tracking-tight text-lg md:text-xl mb-2">Hi, I'm <span class="text-white font-bold tracking-normal">Sampad Sasmal</span></h2>
      <h1 class="text-5xl sm:text-6xl lg:text-8xl font-black tracking-tighter text-white mb-8 leading-[1] md:leading-[0.9]">
        I build <span class="bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400 bg-clip-text text-transparent">world-class</span><br class="hidden sm:block">web interfaces.
      </h1>
      <p class="max-w-2xl mx-auto text-lg md:text-xl text-slate-400 mb-12 leading-relaxed px-4 md:px-0">
        An 11-year Senior Frontend Developer sculpting high-performance applications with Angular and modern architecture.
      </p>
      
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 md:gap-6 pointer-events-auto px-6 md:px-0">
        <a href="#projects" class="w-full sm:w-auto group relative px-8 py-4 bg-white text-slate-950 font-bold rounded-xl transition-all hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.2)] text-center">
          Explore Work
        </a>
        <a href="#contact" class="w-full sm:w-auto px-8 py-4 bg-slate-900 text-white font-bold rounded-xl transition-all border border-slate-800 hover:bg-slate-800 hover:border-slate-700 text-center">
          Get in Touch
        </a>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator - Hidden on very small screens -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce pointer-events-none hidden sm:block">
    <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</section>
