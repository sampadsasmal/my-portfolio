<nav class="fixed top-0 left-0 right-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 md:h-20">
      
      <!-- Brand -->
      <div class="flex items-center">
        <a routerLink="/" fragment="hero" (click)="closeMenu()" class="text-xl font-black tracking-tighter text-white cursor-pointer group">
          SAMPAD<span class="text-blue-500 group-hover:animate-pulse">.</span>S
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:block">
        <div class="ml-10 flex items-center space-x-6 lg:space-x-8">
          <a routerLink="/" fragment="hero" 
             routerLinkActive="text-blue-400 bg-blue-500/10" 
             [routerLinkActiveOptions]="{exact: true, matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'exact'}"
             class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-all">Home</a>
          
          <a routerLink="/" fragment="about" 
             routerLinkActive="text-blue-400 bg-blue-500/10"
             [routerLinkActiveOptions]="{fragment: 'exact'}"
             class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-all">About</a>
          
          <a routerLink="/" fragment="experience" 
             routerLinkActive="text-blue-400 bg-blue-500/10"
             [routerLinkActiveOptions]="{fragment: 'exact'}"
             class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-all">Experience</a>
          
          <a routerLink="/" fragment="projects" 
             routerLinkActive="text-blue-400 bg-blue-500/10"
             [routerLinkActiveOptions]="{fragment: 'exact'}"
             class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-all">Projects</a>
          
          <!-- Modern Hire Me Button -->
          <a routerLink="/" fragment="contact" 
             class="group relative px-6 py-2.5 bg-white text-slate-950 text-xs font-black uppercase tracking-[0.2em] rounded-xl overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-[0_10px_30px_rgba(255,255,255,0.1)]">
            <span class="relative z-10 flex items-center gap-2">
              Hire Me
              <svg class="w-3 h-3 transition-transform duration-500 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </span>
            <div class="absolute inset-0 bg-blue-500 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
          </a>
        </div>
      </div>

      <!-- Mobile Toggle -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="p-2 text-slate-400 hover:text-white focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div *ngIf="isMenuOpen" 
       class="md:hidden absolute top-full left-0 right-0 bg-slate-950 border-b border-slate-800 animate-[fadeIn_0.3s_ease-out]">
    <div class="px-4 pt-2 pb-6 space-y-2">
      <a routerLink="/" fragment="hero" (click)="closeMenu()"
         routerLinkActive="text-blue-400 bg-blue-500/5"
         [routerLinkActiveOptions]="{exact: true, matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'exact'}"
         class="block px-4 py-4 rounded-xl text-base font-bold text-slate-300">Home</a>
      
      <a routerLink="/" fragment="about" (click)="closeMenu()"
         routerLinkActive="text-blue-400 bg-blue-500/5"
         [routerLinkActiveOptions]="{fragment: 'exact'}"
         class="block px-4 py-4 rounded-xl text-base font-bold text-slate-300">About</a>
      
      <a routerLink="/" fragment="experience" (click)="closeMenu()"
         routerLinkActive="text-blue-400 bg-blue-500/5"
         [routerLinkActiveOptions]="{fragment: 'exact'}"
         class="block px-4 py-4 rounded-xl text-base font-bold text-slate-300">Experience</a>
      
      <a routerLink="/" fragment="projects" (click)="closeMenu()"
         routerLinkActive="text-blue-400 bg-blue-500/5"
         [routerLinkActiveOptions]="{fragment: 'exact'}"
         class="block px-4 py-4 rounded-xl text-base font-bold text-slate-300">Projects</a>
      
      <div class="pt-4 px-4">
        <a routerLink="/" fragment="contact" (click)="closeMenu()"
           class="flex items-center justify-center w-full bg-blue-600 text-white py-4 rounded-xl text-base font-bold shadow-lg shadow-blue-500/20">
          Hire Me
        </a>
      </div>
    </div>
  </div>
